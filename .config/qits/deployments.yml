# How qits-platform-deployments deploys this repo. It reads this file from the git host at the built
# sha, so the answer travels with the commit.
#
# CARRYING THE FILE AT ALL is the other thing it says. qits-workspaces reads it on a release to
# decide whether this repository deploys — a library or an SPA carries none and its release is the
# trunk push alone — and then promotes onto the branch it is configured with.
#
# ENVIRONMENT service: every environment runs its own instance, holding that environment's
# configuration, and a green build deploys into whichever tier listens to the built branch. It is
# not a platform service and must not become one: two tiers sharing one configuration store would
# make an edit in dev an edit in prod.
#
# `deployment_target` is written out here rather than left to its default because this is the one
# key a reader of this file will want to check first, and the answer is a decision rather than an
# omission.
deployment_target: environment

# One route for the whole machine surface: the API at /configuration/api and the document at
# /configuration/q. The edge path-routes this prefix verbatim on EVERY host, so both are reachable
# from anywhere. The client is not here — it is what this service's own host serves at its root.
routes: /configuration

# Where this application hangs in the sidebar: under the two kinds of repository that are deployed
# and therefore have configuration. A library, a frontend, a CLI or an image carries none. The
# position is per slot: 6 is Configuration's place in the platform's fixed order of the
# per-repository applications (Api Docs 1, Docs 2, Code 3, CI 4, Artifacts 5, Configuration 6, Workspaces 7).
navigation-entries: services.details.Configuration:6, daemons.details.Configuration:6

# TWO STORES, DECLARED RATHER THAN CONFIGURED. This deployable now joins two jars that each own a
# store: the configuration jar, and qits-eventstream (this service consumes the SoftwareRelease
# event to track the project-agent image version). Each entry is a role and a database of its own on
# the tier's postgres, created before the successor container starts and injected as
# QITS_RESOURCE_<NAME>_URL / _USERNAME / _PASSWORD — the generic contract each jar's datasource reads.
# The NAMES are not free: `db` is what the configuration jar reads, `eventstream` is what the
# qits-eventstream jar reads, and renaming either here silently stops matching.
#
# `db` omits the third segment, so the database is the default derivation: the application name minus
# its `qits-` prefix, dashes to underscores, under a `qits_` prefix — `qits_configuration`.
# `eventstream` cannot omit it: the default would be `qits_configuration` too, and one database
# cannot be two stores with two Flyway lineages, so it is named `qits_configuration_eventstream`.
#
# Provisioning is idempotent and the credential lives in the deployer's registry, so a redeploy finds
# the existing rows and injects the passwords this process is already connected with.
resources: postgresql:db, postgresql:eventstream:qits_configuration_eventstream

# The readiness endpoint the deployer's health gate curls. The convention derives it from the
# repository name and would land on exactly this path — it is written out because this service is
# the one the deployer reads its own configuration from, and a probe that 404s here fails a
# deployment for a reason nobody would look for in a config file.
health_path: /configuration/q/health/ready

# Where the browsable API document lives: swagger-ui under this service's non-application
# root, which sits under the primary route above. The shell's Api Docs viewer reads it off
# /main-navigation and frames it for this repository.
api-docs: /configuration/q/swagger-ui
