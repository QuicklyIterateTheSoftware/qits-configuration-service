# Test-only overrides. This module is the deployable, so its app-level settings live in
# src/main/resources/application.properties and Quarkus MERGES that file into the test config — it is
# not shadowed by this one. Never re-declare an app-level setting here: a test copy that drifts from
# the shipped copy makes the suite lie, passing on a value no deployment ever gets.

# A FREE port, not Quarkus' default test port 8081. Two reasons, and the first is not theoretical:
#   - on the deployment host 8081 is the address the platform's own npm registry is published on, so
#     on the one machine this service is most likely to be built on the default port is already
#     bound and the whole suite dies with "Port already bound: 8081", which reads like a code failure
#     and is not one;
#   - even where 8081 is free, @QuarkusTest restarts race each other for it.
# Failsafe passes the same value to the packaged artifact (service/pom.xml).
quarkus.http.test-port=0

# NO DEV SERVICES. A clone tests green with no docker, and a dev service is a container start:
# quarkus-oidc launches a real Keycloak whenever a profile leaves quarkus.oidc.auth-server-url unset,
# and an unnamed default datasource invites one of its own. Measured on the siblings, not feared.
# Nothing here needs one: the datasource is an embedded postgres the suite starts itself, and the
# OIDC tenant is disabled because qits.auth.machine.required defaults false.
quarkus.devservices.enabled=false

# BOTH datasources run against an EMBEDDED POSTGRES — real binaries, spawned as a child process by
# zonky. Their ports are chosen at run time, so no url/username/password is written here at all:
# EmbeddedPgConfigSource supplies them at an ordinal above this file, one database per datasource.
# clean-at-start wipes each schema between Quarkus restarts, which is what keeps a suite that shares
# one database across classes reproducible.
#
# The second lineage is the eventstream outbox's, and it needs a database even though the bus is DARK
# in %test: `qits.eventstream.enabled=false` stops publishing, sweeping and dialling, not the
# datasource — Quarkus opens the connection and migrates at boot regardless. No `locations` for
# either: each list ships in its own jar's META-INF/microprofile-config.properties, and a copy here
# would migrate a different lineage than the deployment does.
quarkus.flyway.configuration.clean-at-start=true
quarkus.flyway.eventstream.clean-at-start=true

# NOTHING SWEEPS THE EVENT LOG BEHIND A TEST. The durable listener makes the eventstream jar run a
# catch-up sweep at startup and every 30s; against no qits-events (the bus is dark here) it finds
# nothing, but the startup tick is turned off and the interval stretched so a sweep can never land
# mid-test. The scheduler stays ON — the outbox sweeper is scheduled too and has no business being
# disabled — the same pair qits-ci sets, for the same reason.
qits.eventstream.catchup-at-startup=false
qits.eventstream.catchup-interval=PT24H

# THE USERFLOWS CLASS ORDERER, INSTALLED THE ONE WAY QUARKUS PERMITS. quarkus-junit ships its own
# junit-platform.properties with a ClassOrderer that groups tests by @TestProfile (so a profile's
# application isn't torn down under a class still running), and surefire HARD-FAILS if a local
# junit-platform.properties overrides it. The blessed seam is the secondary orderer, which breaks
# ties INSIDE a profile group — story classes sharing a profile still run in topological
# @UserflowPrecondition order, and the ordinary test classes (no story annotations) are untouched.
# The framework's registries are per-JVM: keep the single sequential test JVM (surefire/failsafe
# default forkCount=1); do not enable parallel execution.
#
# It lives in this file rather than a failsafe-only one even though TokenValidationBootstrapIT is
# this module's only story today: src/test/resources is one classpath for surefire and failsafe
# alike, and a second copy under another name is a value free to drift.
junit.quarkus.orderer.secondary-orderer=eu.wohlben.qits.userflows.UserflowClassOrderer
